<div class="graph">
  <app-page-title title="Analytics"></app-page-title>
  <div class="graph__setion">
    <div class="graph__head">
      <h2>Monthly Earnings Analytics</h2>
      <div class="graph__filter">
        <app-form-field-wrapper [isFormField]="false" label="Start Date">
          <input
            type="date"
            class="date-input"
            (change)="onStartDateChange()"
            [(ngModel)]="startDate"
            placeholder="Start Date"
          />
        </app-form-field-wrapper>

        <app-form-field-wrapper [isFormField]="false" label="End Date">
          <input
            type="date"
            class="date-input"
            (change)="onEndDateChange()"
            [(ngModel)]="endDate"
            placeholder="End Date"
          />
        </app-form-field-wrapper>
      </div>
    </div>
    <div class="graph__body">
      <canvas id="earnings-chart"></canvas>
    </div>
  </div>

  <!-- booking count  -->
  <div class="graph__setion">
    <app-bookings-count-chart
      [chartData]="bookingsCountChartData"
      (getChartData)="getBookingsCountChartData($event)"
    ></app-bookings-count-chart>
  </div>
</div>
