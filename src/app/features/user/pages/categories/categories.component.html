<div class="categories container">
  <div class="categories__wrapper">
    <app-page-title title="Categories"></app-page-title>

    <div class="categories__cards-wrapper">
      @for (item of categories(); track item.id) {
        <app-parent-category-card
          (parentCategorySelect)="onCategoryClick($event)"
          [categoryCard]="item"
        ></app-parent-category-card>
      }
    </div>
  </div>
</div>
