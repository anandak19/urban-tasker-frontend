<section class="ready-cta">
  <div class="ready-cta__content">
    <h2 class="ready-cta__title">Ready to cross that task off your list?</h2>

    <p class="ready-cta__subtitle">
      Join thousands of happy customers who save time and stress by booking with
      Urban Tasker.
    </p>

    <div class="ready-cta__actions">
      <app-button size="large" (clickEvent)="navigateBooking()"
        >Book Your First Task</app-button
      >
      <app-button
        variant="secondary"
        size="large"
        (clickEvent)="navigateBecomeTasker()"
        >Become a Tasker</app-button
      >
    </div>

    <div class="ready-cta__guarantee">
      <span class="check-icon">✔</span>
      <span>Happiness Guarantee Included</span>
    </div>
  </div>
</section>
